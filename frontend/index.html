<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🌱</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KisanConnect is a direct agricultural marketplace connecting FPOs and farmers directly to consumers and industrial bulk buyers." />
    <title>KisanConnect | Direct Farmer & FPO Marketplace</title>
    
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Google Translate Element (hidden) and initialization scripts -->
    <div id="google_translate_element" style="display: none;"></div>
    <style>
      /* Prevent and hide Google Translate legacy and modern toolbar banners / popup widgets */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe[class*="goog-te-banner-frame"],
      .goog-te-banner,
      #google_translate_element,
      .goog-te-gadget,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      iframe[class*="VIpgJd-ZVi9od"],
      [class*="VIpgJd-ZVi9od"] {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
      }
      html {
        margin-top: 0px !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
    </style>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,gu,mr,te,ta,bn,kn,pa,ml',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
